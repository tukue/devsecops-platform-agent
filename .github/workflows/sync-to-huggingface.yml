name: Sync Hugging Face Space

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_run' &&
          needs.validate.result == 'skipped' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' &&
          needs.validate.result == 'success')
      )

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Hugging Face CLI
        run: python -m pip install "huggingface_hub==2.2.0"

      - name: Sync Space
        env:
          HF_OIDC_RESOURCE: spaces/Tukue/platform-eng-agent-advisor
          SYNC_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          hf upload Tukue/platform-eng-agent-advisor . . \
            --repo-type space \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --commit-message "Sync from GitHub ${SYNC_SHA::7}"
